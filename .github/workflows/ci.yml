name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uzmyjob
          POSTGRES_PASSWORD: password
          POSTGRES_DB: uzmyjob_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        env:
          BOT_TOKEN: test_token_12345
          GEMINI_API_KEY: test_gemini_key
          POSTGRES_URL: postgresql+asyncpg://uzmyjob:password@localhost:5432/uzmyjob_test
          FERNET_KEY: ${{ secrets.FERNET_KEY_TEST }}
        run: pytest tests/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t uzmyjob-bot:ci .

