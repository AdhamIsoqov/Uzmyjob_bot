name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uzmyjob
          POSTGRES_PASSWORD: password
          POSTGRES_DB: uzmyjob_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests scripts

      - name: Run migrations, tests and smoke check
        env:
          BOT_TOKEN: "123456789:CI_TEST_BOT_TOKEN"
          GEMINI_API_KEY: "ci-test-gemini-key"
          POSTGRES_URL: postgresql+asyncpg://uzmyjob:password@localhost:5432/uzmyjob_test
        run: |
          export FERNET_KEY="${{ secrets.FERNET_KEY_TEST }}"
          if [ -z "$FERNET_KEY" ]; then
            export FERNET_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          fi
          alembic upgrade head
          pytest tests/ -v --tb=short --cov=uzmyjob --cov-report=term-missing
          python scripts/smoke_test.py

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t uzmyjob-bot:ci .
