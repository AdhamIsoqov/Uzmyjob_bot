# Render.com Blueprint Infrastructure as Code (IaC)
# Render Free rejasi cheklovlari:
# - Free Web Service 15 daqiqa harakatsizlikdan keyin uyquga ketadi (APScheduler to'xtaydi).
# - Free PostgreSQL ma'lumotlar bazasi 90 kundan keyin muddati tugaydi.
# - Local fayl tizimi doimiy emas (restartda log/backup fayllari o'chadi).
version: "1"

services:
  - type: web
    name: uzmyjob-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FERNET_KEY
        sync: false # Eslatma: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())" bilan yarating
      - key: WEBHOOK_URL
        sync: false # Masalan: https://uzmyjob-bot.onrender.com
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: uzmyjob-db
          property: connectionString
      - key: POLL_INTERVAL_MINUTES
        value: "15"
      - key: MATCH_THRESHOLD
        value: "0.55"

databases:
  - name: uzmyjob-db
    databaseName: uzmyjob
    user: uzmyjob
    plan: free
    region: frankfurt
