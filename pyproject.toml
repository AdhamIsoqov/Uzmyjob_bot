[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uzmyjob"
version = "0.1.0"
description = "AI-powered Uzbekistan job aggregator and Telegram application assistant"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "aiohttp>=3.9",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "cryptography>=42.0",
    "structlog>=24.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "google-genai>=2.30.1",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uzmyjob = ["templates/*.jinja2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
