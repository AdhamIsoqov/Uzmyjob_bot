[project]
name = "uzmyjob"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "cryptography>=42.0",
    "structlog>=24.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "scikit-learn>=1.4",
    "google-genai>=2.30.1",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "httpx",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
