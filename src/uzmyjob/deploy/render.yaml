# Render.com Blueprint Infrastructure as Code (IaC)
# Loyihani Render da bitta tugma bilan ishga tushirish uchun
version: "1"

services:
  - type: web
    name: uzmyjob-bot
    runtime: docker
    dockerfilePath: src/uzmyjob/deploy/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt # O'zbekistonga eng past kechikishli (latency) server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false # Render panelida kiritiladi
      - key: GEMINI_API_KEY
        sync: false # Render panelida kiritiladi
      - key: FERNET_KEY
        generateValue: true # Render 32-baytlik xavfsiz kalitni o'zi yaratadi
      - key: WEBHOOK_URL
        sync: false # https://uzmyjob-bot.onrender.com
      - key: WEBHOOK_SECRET
        generateValue: true # Xavfsiz webhook secret
      - key: DATABASE_URL
        fromDatabase:
          name: uzmyjob-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: POLL_INTERVAL_MINUTES
        value: "15"

databases:
  - name: uzmyjob-db
    databaseName: uzmyjob
    user: uzmyjob
    plan: free
    region: frankfurt
