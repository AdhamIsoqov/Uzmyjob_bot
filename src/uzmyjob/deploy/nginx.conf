# @Uzmyjob_bot Nginx Production Configuration
# Joylashuv: /etc/nginx/sites-available/uzmyjob.conf

limit_req_zone $binary_remote_addr zone=telegram_flood:10m rate=30r/m;

server {
    listen 80;
    server_name bot.uzmyjob.uz;

    # Let's Encrypt Certbot tekshiruvi uchun
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Barcha HTTP so'rovlarni HTTPS ga yo'naltirish
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name bot.uzmyjob.uz;

    # SSL sertifikatlari (Certbot orqali o'rnatiladi)
    ssl_certificate /etc/letsencrypt/live/bot.uzmyjob.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.uzmyjob.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Xavfsizlik sarlavhalari
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    client_max_body_size 25M;

    # 1. Telegram Webhook endpoint
    location /webhook {
        limit_req zone=telegram_flood burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # 2. Healthcheck endpoint
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # 3. Prometheus /metrics (Faqat lokal yoki himoyalangan IP lar uchun)
    location /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8000/metrics;
    }

    # Standart xatolik sahifalari
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

