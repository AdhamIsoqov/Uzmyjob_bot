# @Uzmyjob_bot Nginx Production Configuration (VPS uchun)
# Joylashuv: /etc/nginx/sites-available/uzmyjob.conf

limit_req_zone $binary_remote_addr zone=telegram_webhook:10m rate=1000r/m;

server {
    listen 80;
    server_name bot.uzmyjob.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name bot.uzmyjob.uz;

    ssl_certificate /etc/letsencrypt/live/bot.uzmyjob.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.uzmyjob.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    client_max_body_size 25M;

    location /webhook {
        limit_req zone=telegram_webhook burst=50 nodelay;

        proxy_pass http://127.0.0.1:8080/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8080/metrics;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
