services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uzmyjob
      POSTGRES_PASSWORD: password
      POSTGRES_DB: uzmyjob
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uzmyjob"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./src:/app/src

volumes:
  pgdata:
